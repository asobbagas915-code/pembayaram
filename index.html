<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Cashless NFC System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl p-6 border border-slate-800">
    <h1 class="text-xl font-extrabold text-center mb-2 text-emerald-400">Monopoly Cashless NFC</h1>
    <p class="text-xs text-center text-slate-400 mb-6">Sistem Bayaran Terus Menggunakan Kad Fizikal & NFC Telefon</p>
    
    <!-- Kotak Log Aktiviti / Status NFC -->
    <div class="bg-slate-950 rounded-xl p-3 mb-4 border border-slate-800 h-32 overflow-y-auto font-mono text-xs" id="log-box">
      <p class="text-slate-500">> Sistem bersedia. Tekan butang 'Mula Imbas'...</p>
    </div>

    <!-- Mod Operasi (Bayar vs Daftar Kad) -->
    <div class="grid grid-cols-2 gap-2 mb-4">
      <button onclick="setMode('pay')" id="mode-pay-btn" class="py-2 px-3 rounded-lg font-semibold text-xs bg-emerald-600 text-white transition">
        Mod: Bayar / Sewa
      </button>
      <button onclick="setMode('register')" id="mode-reg-btn" class="py-2 px-3 rounded-lg font-semibold text-xs bg-slate-800 text-slate-300 transition">
        Mod: Daftar Kad Baru
      </button>
    </div>

    <!-- Kawalan Butang Utama -->
    <div class="flex gap-2 mb-6">
      <button id="btn-scan" onclick="startNFCScan()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 font-bold py-3 px-4 rounded-xl shadow-lg transition text-sm">
        Mula Imbas NFC
      </button>
      <button onclick="resetDataStorage()" class="bg-rose-900/40 hover:bg-rose-900/60 border border-rose-700/50 text-rose-300 font-semibold py-3 px-4 rounded-xl text-xs transition" title="Reset Data">
        Reset
      </button>
    </div>

    <!-- Senarai Pemain & Baki -->
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">Akaun Pemain</h2>
      <span class="text-xs text-slate-400" id="total-players-text">0 Pemain</span>
    </div>
    
    <div class="space-y-2 max-h-56 overflow-y-auto pr-1" id="players-list">
      <!-- Dipaparkan secara dinamik melalui JS -->
    </div>
  </div>

  <!-- Modal Pendaftaran / Transaksi Ringkas -->
  <div id="action-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-xs shadow-2xl">
      <h3 id="modal-title" class="text-base font-bold text-emerald-400 mb-2">Maklumat Kad</h3>
      <p id="modal-desc" class="text-xs text-slate-300 mb-4">-</p>
      <div id="modal-form-content" class="mb-4">
        <!-- Input tambahan dinamik -->
      </div>
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-xs font-semibold">Batal</button>
        <button id="modal-confirm-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg text-xs font-semibold">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'pay'; // 'pay' atau 'register'
    let activeScannedUID = null;

    // Data Asal Pemain
    let players = JSON.parse(localStorage.getItem('monopoly_nfc_players')) || [
      { id: "DEMO_ID_1", name: "Pemain 1 (Banker)", balance: 15000 },
      { id: "DEMO_ID_2", name: "Pemain 2", balance: 10000 }
    ];

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'pay') {
        document.getElementById('mode-pay-btn').className = "py-2 px-3 rounded-lg font-semibold text-xs bg-emerald-600 text-white transition";
        document.getElementById('mode-reg-btn').className = "py-2 px-3 rounded-lg font-semibold text-xs bg-slate-800 text-slate-300 transition";
        logMessage("Mod ditukar: Sedia untuk imbas bayaran / sewa tanah.", "info");
      } else {
        document.getElementById('mode-pay-btn').className = "py-2 px-3 rounded-lg font-semibold text-xs bg-slate-800 text-slate-300 transition";
        document.getElementById('mode-reg-btn').className = "py-2 px-3 rounded-lg font-semibold text-xs bg-teal-600 text-white transition";
        logMessage("Mod ditukar: Tekap kad baru untuk daftarkan pemilik.", "info");
      }
    }

    function updateUI() {
      const listContainer = document.getElementById('players-list');
      listContainer.innerHTML = '';
      document.getElementById('total-players-text').innerText = `${players.length} Pemain`;

      players.forEach(p => {
        listContainer.innerHTML += `
          <div class="flex justify-between items-center bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
            <div>
              <p class="font-bold text-slate-100 text-sm">${p.name}</p>
              <p class="text-[10px] text-slate-400 font-mono">UID: ${p.id}</p>
            </div>
            <div class="text-right">
              <span class="text-emerald-400 font-extrabold text-sm">RM ${p.balance.toLocaleString()}</span>
              <div class="flex gap-1 mt-1 justify-end">
                <button onclick="adjustBalance('${p.id}', 500)" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-emerald-300">+500</button>
                <button onclick="adjustBalance('${p.id}', -500)" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-rose-300">-500</button>
              </div>
            </div>
          </div>
        `;
      });
      localStorage.setItem('monopoly_nfc_players', JSON.stringify(players));
    }

    function logMessage(msg, type = 'info') {
      const logBox = document.getElementById('log-box');
      let color = 'text-slate-300';
      if (type === 'success') color = 'text-emerald-400';
      if (type === 'error') color = 'text-rose-400';
      if (type === 'info') color = 'text-cyan-400';

      logBox.innerHTML += `<p class="${color} mt-1">> ${msg}</p>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function startNFCScan() {
      if (!('NDEFReader' in window)) {
        logMessage("Web NFC tidak disokong pada pelayar ini. Sila guna Google Chrome Android.", "error");
        alert("Web NFC tidak disokong pada peranti/pelayar ini.");
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        logMessage("Pengimbasan aktif... Sila tekap kad NFC ke belakang telefon.", "success");

        ndef.onreading = event => {
          const serialNumber = event.serialNumber; // UID unik kad fizikal
          handleScannedCard(serialNumber);
        };

        ndef.onreadingerror = () => {
          logMessage("Gagal membaca kad. Sila tekap semula dengan stabil.", "error");
        };

      } catch (error) {
        if (error.name === "NotAllowedError") {
          logMessage("Ralat: Kebenaran NFC ditolak. Sila benarkan akses NFC di tetapan Chrome.", "error");
        } else {
          logMessage(`Ralat NFC: ${error.message}`, "error");
        }
      }
    }

    function handleScannedCard(uid) {
      logMessage(`Kad dikesan! UID: ${uid}`, "success");
      let existingPlayer = players.find(p => p.id === uid);

      if (currentMode === 'register') {
        if (existingPlayer) {
          logMessage(`Kad ini sudah didaftarkan atas nama ${existingPlayer.name}.`, "error");
          alert(`Kad ini sudah digunakan oleh ${existingPlayer.name}`);
        } else {
          activeScannedUID = uid;
          openRegisterModal(uid);
        }
      } else {
        // Mod Bayar / Urusniaga
        if (existingPlayer) {
          // Contoh transaksi automatik tolak RM300 (Bayar sewa / beli petak)
          existingPlayer.balance -= 300;
          logMessage(`Bayaran RM300 berjaya dari ${existingPlayer.name}. Baki: RM${existingPlayer.balance}`, "success");
          updateUI();
        } else {
          logMessage(`Kad tidak dikenali (UID: ${uid}). Sila tukar ke 'Mod Daftar Kad Baru'.`, "error");
        }
      }
    }

    function openRegisterModal(uid) {
      document.getElementById('modal-title').innerText = "Daftar Pemain Baru";
      document.getElementById('modal-desc').innerText = `ID Kad Terkesan: ${uid}`;
      document.getElementById('modal-form-content').innerHTML = `
        <label class="block text-xs text-slate-400 mb-1">Nama Pemain:</label>
        <input type="text" id="new-player-name" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="Cth: Ali / Pemain 4" />
      `;
      document.getElementById('modal-confirm-btn').onclick = function() {
        const nameInput = document.getElementById('new-player-name').value.trim();
        if (nameInput) {
          players.push({ id: uid, name: nameInput, balance: 15000 }); // Modal permulaan standard Monopoly
          updateUI();
          logMessage(`Berjaya daftar ${nameInput} dengan kad NFC ini!`, "success");
          closeModal();
        } else {
          alert("Sila masukkan nama pemain.");
        }
      };
      document.getElementById('action-modal').classList.remove('hidden');
    }

    function adjustBalance(id, amount) {
      let p = players.find(x => x.id === id);
      if (p) {
        p.balance += amount;
        updateUI();
        logMessage(`Baki ${p.name} dikemas kini sebanyak ${amount > 0 ? '+' : ''}${amount}.`, "info");
      }
    }

    function closeModal() {
      document.getElementById('action-modal').classList.add('hidden');
    }

    function resetDataStorage() {
      if (confirm("Padam semua data pemain?")) {
        localStorage.removeItem('monopoly_nfc_players');
        location.reload();
      }
    }

    // Paparan permulaan
    updateUI();
  </script>
</body>
</html>
