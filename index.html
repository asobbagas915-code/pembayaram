<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Cashless Bank Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl p-6 border border-slate-800">
    <h1 class="text-xl font-extrabold text-center mb-1 text-emerald-400">Monopoly Bank Terminal</h1>
    <p class="text-xs text-center text-slate-400 mb-5">Sistem Kawalan Bank & Imbas NFC</p>
    
    <!-- Tetapan Jumlah Transaksi & Tindakan -->
    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4">
      <label class="block text-xs font-semibold text-slate-300 mb-1">Jumlah Transaksi (RM):</label>
      <input type="number" id="txn-amount" value="500" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-base font-bold text-emerald-400 mb-3 focus:outline-none focus:border-emerald-500" />
      
      <div class="grid grid-cols-2 gap-2">
        <button onclick="setTxnType('minus')" id="btn-type-minus" class="py-2 rounded-lg text-xs font-bold bg-rose-600 text-white transition">
          - Tolak (Bayar/Sewa)
        </button>
        <button onclick="setTxnType('plus')" id="btn-type-plus" class="py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 transition">
          + Tambah (Gaji/Bank)
        </button>
      </div>
    </div>

    <!-- Kotak Log Status NFC -->
    <div class="bg-slate-950 rounded-xl p-3 mb-4 border border-slate-800 h-28 overflow-y-auto font-mono text-xs" id="log-box">
      <p class="text-slate-500">> Sedia. Masukkan jumlah, pilih mod, dan tekan butang imbas...</p>
    </div>

    <!-- Butang Tindakan Utama -->
    <div class="flex gap-2 mb-6">
      <button onclick="startNFCScan()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 font-bold py-3 px-4 rounded-xl shadow-lg transition text-sm">
        Tekap Kad NFC
      </button>
      <button onclick="openRegisterModalDirect()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 px-3 rounded-xl text-xs transition" title="Daftar Kad">
        + Daftar Kad
      </button>
    </div>

    <!-- Senarai Pemain -->
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">Senarai Akaun Pemain</h2>
      <button onclick="resetDataStorage()" class="text-[10px] text-rose-400 hover:underline">Reset Data</button>
    </div>
    
    <div class="space-y-2 max-h-48 overflow-y-auto pr-1" id="players-list">
      <!-- Dinamik JS -->
    </div>
  </div>

  <!-- Modal Pendaftaran Kad Baru -->
  <div id="action-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-xs shadow-2xl">
      <h3 class="text-base font-bold text-emerald-400 mb-2">Daftar Kad Baru</h3>
      <p id="modal-desc" class="text-xs text-slate-300 mb-3">Sila tekap kad atau masukkan nama.</p>
      <input type="text" id="new-player-name" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white mb-4 focus:outline-none focus:border-emerald-500" placeholder="Nama Pemain (Cth: Ali)" />
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 bg-slate-800 py-2 rounded-lg text-xs font-semibold">Batal</button>
        <button onclick="saveNewPlayer()" class="flex-1 bg-emerald-600 py-2 rounded-lg text-xs font-semibold">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    let txnType = 'minus'; // 'minus' atau 'plus'
    let pendingUID = null;

    let players = JSON.parse(localStorage.getItem('monopoly_bank_players')) || [
      { id: "DEMO_1", name: "Pemain 1 (Banker)", balance: 15000 },
      { id: "DEMO_2", name: "Pemain 2", balance: 10000 }
    ];

    function setTxnType(type) {
      txnType = type;
      if (type === 'minus') {
        document.getElementById('btn-type-minus').className = "py-2 rounded-lg text-xs font-bold bg-rose-600 text-white transition";
        document.getElementById('btn-type-plus').className = "py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 transition";
      } else {
        document.getElementById('btn-type-minus').className = "py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 transition";
        document.getElementById('btn-type-plus').className = "py-2 rounded-lg text-xs font-bold bg-emerald-600 text-white transition";
      }
    }

    function updateUI() {
      const listContainer = document.getElementById('players-list');
      listContainer.innerHTML = '';
      players.forEach(p => {
        listContainer.innerHTML += `
          <div class="flex justify-between items-center bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
            <div>
              <p class="font-bold text-slate-100 text-xs">${p.name}</p>
              <p class="text-[9px] text-slate-400 font-mono">ID: ${p.id}</p>
            </div>
            <div class="text-right">
              <span class="text-emerald-400 font-extrabold text-xs">RM ${p.balance.toLocaleString()}</span>
            </div>
          </div>
        `;
      });
      localStorage.setItem('monopoly_bank_players', JSON.stringify(players));
    }

    function logMessage(msg, type = 'info') {
      const logBox = document.getElementById('log-box');
      let color = type === 'success' ? 'text-emerald-400' : type === 'error' ? 'text-rose-400' : 'text-cyan-400';
      logBox.innerHTML += `<p class="${color} mt-1">> ${msg}</p>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function startNFCScan() {
      if (!('NDEFReader' in window)) {
        alert("Web NFC memerlukan pelayar Google Chrome Android.");
        return;
      }

      const amount = parseFloat(document.getElementById('txn-amount').value);
      if (isNaN(amount) || amount <= 0) {
        alert("Sila masukkan jumlah nilai transaksi yang sah.");
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        logMessage(`Sedia imbas untuk ${txnType === 'plus' ? 'TAMBAH' : 'TOLAK'} RM${amount}. Tekap kad...`, "info");

        ndef.onreading = event => {
          const uid = event.serialNumber;
          let player = players.find(p => p.id === uid);

          if (player) {
            if (txnType === 'plus') {
              player.balance += amount;
              logMessage(`Berjaya tambah RM${amount} kepada ${player.name}. Baki: RM${player.balance}`, "success");
            } else {
              player.balance -= amount;
              logMessage(`Berjaya tolak RM${amount} dari ${player.name}. Baki: RM${player.balance}`, "success");
            }
            updateUI();
          } else {
            pendingUID = uid;
            document.getElementById('modal-desc').innerText = `Kad Baru dikesan (UID: ${uid}). Masukkan nama:`;
            document.getElementById('action-modal').classList.remove('hidden');
          }
        };
      } catch (error) {
        logMessage(`Ralat NFC: ${error.message}`, "error");
      }
    }

    function openRegisterModalDirect() {
      pendingUID = "MANUAL_" + Date.now();
      document.getElementById('modal-desc').innerText = "Daftar pemain tanpa imbasan segera:";
      document.getElementById('action-modal').classList.remove('hidden');
    }

    function saveNewPlayer() {
      const name = document.getElementById('new-player-name').value.trim();
      if (name && pendingUID) {
        players.push({ id: pendingUID, name: name, balance: 15000 });
        updateUI();
        logMessage(`Pemain ${name} berjaya didaftarkan!`, "success");
        closeModal();
      } else {
        alert("Sila masukkan nama pemain.");
      }
    }

    function closeModal() {
      document.getElementById('action-modal').classList.add('hidden');
      document.getElementById('new-player-name').value = '';
      pendingUID = null;
    }

    function resetDataStorage() {
      if (confirm("Reset semua data permainan?")) {
        localStorage.removeItem('monopoly_bank_players');
        location.reload();
      }
    }

    updateUI();
  </script>
</body>
</html>
